name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Ejecutar la suite con cobertura
        run: python -m pytest --cov=envios --cov-branch --cov-report=term-missing --cov-fail-under=100
